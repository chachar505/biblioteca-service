spring.application.name=library-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_library}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

usuario.service.url=${USUARIO_SERVICE_URL:http://localhost:8081}
juego.service.url=${JUEGO_SERVICE_URL:http://localhost:8082}

logging.level.com.gameup.library_service.client=DEBUG